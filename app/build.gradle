apply plugin: 'com.android.application'

android {
    compileSdk 34
    buildToolsVersion "34.0.0-rc3"
    defaultConfig {
        applicationId "com.lmb.fr.lmbapplicationnouga"
        minSdk 31
        targetSdk 31
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.lmb.fr.lmbapplicationnouga'
}

// Tâche Gradle automatique pour réactiver l'Accessibilité et la Superposition après chaque installation
tasks.register('enableAccessibilityPermissions') {
    doLast {
        try {
            def adb = android.getAdbExecutable().toString()
            exec {
                commandLine adb, 'shell', 'pm', 'grant', 'com.lmb.fr.lmbapplicationnouga', 'android.permission.WRITE_SECURE_SETTINGS'
            }
            exec {
                commandLine adb, 'shell', 'settings', 'put', 'secure', 'enabled_accessibility_services', 'com.lmb.fr.lmbapplicationnouga/.LMBAccessibilityService'
            }
            exec {
                commandLine adb, 'shell', 'settings', 'put', 'secure', 'accessibility_enabled', '1'
            }
            exec {
                commandLine adb, 'shell', 'appops', 'set', 'com.lmb.fr.lmbapplicationnouga', 'SYSTEM_ALERT_WINDOW', 'allow'
            }
            println "Autorisations d'Accessibilité, WRITE_SECURE_SETTINGS et Superposition appliquées avec succès via Gradle !"
        } catch (Exception e) {
            println "Avertissement lors de l'application des autorisations ADB: " + e.message
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("install")) {
        task.finalizedBy('enableAccessibilityPermissions')
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0-rc02'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
}
